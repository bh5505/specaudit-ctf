# CTF catalog: arm handlers, heads, and reference methodology entries.

version: 1
entries:
  - id: learning-operator
    kind: arm
    protocols: [cli]
    notes: "Runs local example assessment workflows over caller-supplied input and returns structured results."

  - id: loopback
    kind: methodology-only
    protocols: [none]
    notes: "Native pack-check and validation-client lanes in the specaudit CTF suite. Methodology for this extension, not an adapter."

  - id: foundry
    kind: methodology-only
    protocols: [none]
    notes: "Open specification for agentic security evaluation, finding lifecycle, and spec-kit workflow."

  - id: codeguard
    kind: methodology-only
    protocols: [mcp, http]
    notes: "Model-agnostic secure-by-default rule corpus for AI coding agents, with optional MCP packaging. A check contract, not a scanner."

  - id: vulnhunter
    kind: methodology-only
    protocols: [none]
    notes: "Attacker-first hunt, falsify, and verify skills. Teach-only methodology."

  - id: edge-device-posture
    kind: methodology-only
    protocols: [none]
    notes: "Network-edge device posture review (router/CPE/IoT-appliance class) - plane model (management, admin/data, config artifacts), version-disclosure posture, and offline-image vs live-surface reconciliation, with absence-shaped reconciliation verdicts stated explicitly. Instantiated by the lab-edge-01-device-posture live-service challenge against the golden lab target; generalizes to any appliance image with a declared service set."

  - id: defending-code
    kind: methodology-only
    protocols: [none]
    notes: "Reference recon, find, verify, report, and patch harness with scan skills organized by threat model."

  - id: mantis
    kind: methodology-only
    protocols: [none]
    notes: "Portable multi-stage skill toolkit with inspectable artifacts. Teach-only methodology."

  - id: raptor
    kind: methodology-only
    protocols: [none]
    notes: "Autonomous offensive and defensive review framework that layers static engines under an agent decision loop."

  - id: deepsec
    kind: arm
    protocols: [cli]
    notes: "Runs the installed Deepsec CLI in the configured workspace. scan writes workspace state; process can spend model tokens and substantial service cost."

  - id: vvah
    kind: arm
    protocols: [cli]
    notes: "Runs the installed VVAH CLI against the operator-selected repository. doctor may contact configured backends; scan and remediate may spend model tokens, and remediate edits source."

  - id: ai-deep-sast
    kind: arm
    protocols: [cli]
    notes: "Runs the installed AI Deep SAST CLI against an operator-selected target. scan, dry_run, and ai_scan are available; model-backed actions may spend tokens."

  - id: trailofbits
    kind: methodology-only
    protocols: [none]
    notes: "Marketplace of composable specialist review skills for Claude Code CLI and Codex CLI."

  - id: cloudflare
    kind: methodology-only
    protocols: [none]
    notes: "Six-phase security-audit skill covering recon, hunt, adversarial validate, report, and independent verify."

  - id: metasploit-mcp
    kind: arm
    protocols: [mcp, http]
    notes: "Connects to an operator-configured Metasploit MCP server over HTTP and SSE. Available actions come from that server and may run modules, sessions, payloads, or listeners."

  - id: burp-mcp
    kind: arm
    protocols: [mcp, http]
    notes: "Connects to an operator-configured Burp MCP server over SSE. Available actions come from the connected Burp instance and can read or change its state or issue requests."

  - id: agent-wiz
    kind: arm
    protocols: [cli]
    notes: "Runs agent-wiz graph extraction, visualization, and analysis against operator-selected paths. Analysis may send code to a configured model service and incur cost."

  - id: maestro
    kind: methodology-only
    protocols: [http]
    notes: "Agentic threat-modeling reference application. Methodology artifact, not an adapter."

  - id: prowler-mcp
    kind: arm
    protocols: [mcp, http]
    notes: "Connects to an operator-configured Prowler MCP server over streamable HTTP. Available actions come from the connected server and may query or change cloud configuration."

  - id: semgrep-mcp
    kind: arm
    protocols: [mcp, cli, http]
    notes: "Runs the installed Semgrep CLI against an operator-selected path and rule config, or calls tools advertised by a configured Semgrep MCP server."

  - id: google-mcp-security
    kind: arm
    protocols: [mcp, http]
    notes: "Connects to an operator-configured Google Threat Intelligence MCP server. Available actions come from the server and can include uploads or collection updates."

  - id: garak
    kind: arm
    protocols: [cli]
    notes: "Lists probes and detectors through the installed Garak CLI and reads reports from the operator-selected report directory."

  - id: pyrit
    kind: arm
    protocols: [cli]
    notes: "Lists or runs configured PyRIT scenarios; scans may contact model endpoints and incur cost."

  - id: mitre-atlas
    kind: methodology-only
    protocols: [none]
    notes: "Adversary knowledge base for AI-enabled systems. Curriculum only."

  - id: cyberseceval
    kind: methodology-only
    protocols: [none]
    notes: "Published LLM security benchmark suites. Curriculum and eval reference."

  - id: cybench
    kind: methodology-only
    protocols: [none]
    notes: "Professional CTF task set with subtask grading. Challenge-design reference."

  - id: owasp-agentic
    kind: methodology-only
    protocols: [none]
    notes: "OWASP agentic application threats, mitigations, and MCP security guides."

  - id: checkov
    kind: arm
    protocols: [cli]
    notes: "Runs Checkov Terraform checks against an operator-selected directory, defaulting to the packaged synthetic range."

  - id: cloudgoat
    kind: methodology-only
    protocols: [cli]
    notes: "Vulnerable-by-design cloud scenarios. Range and curriculum reference, not an adapter."

  - id: stratus-red-team
    kind: arm
    protocols: [cli]
    notes: "Lists local techniques or runs Stratus warmup, detonate, and revert commands against the operator-configured cloud account."

  - id: attackforge-testsuites
    kind: methodology-only
    protocols: [none]
    notes: "Import-ready methodology checklists including telecom and cloud suites."

  - id: attackforge-writeups
    kind: methodology-only
    protocols: [none]
    notes: "Finding-writeup knowledge bases covering ATT&CK, ATLAS, CWE, and CAPEC."

  - id: attack-stix-data
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied STIX bundle for ATT&CK technique, software, group, relationship, and CVE mappings; a small demo bundle is included."

  - id: vulnify
    kind: arm
    protocols: [cli]
    notes: "Reads vulnerability records from an operator-supplied local feed or JSON snapshot."

  - id: snmp-readtier
    kind: arm
    protocols: [cli]
    notes: "Sends a bounded SNMPv2c GET for selected identity OIDs and reports the response or timeout."

  - id: ike-readtier
    kind: arm
    protocols: [cli]
    notes: "Sends a bounded IKEv1 responder probe on the selected UDP port and reports the response or timeout."

  - id: mitreattack-python
    kind: arm
    protocols: [cli]
    notes: "Converts an operator-supplied local STIX bundle to Excel through the installed ATT&CK CLI."

  - id: mitre-cti
    kind: methodology-only
    protocols: [none]
    notes: "STIX 2.0 ATT&CK and CAPEC datasets maintained alongside the 2.1 corpus."

  - id: vuls
    kind: arm
    protocols: [cli]
    notes: "Runs Vuls scan, fetch, report, or summary through the installed CLI and its configuration."

  - id: zaproxy
    kind: arm
    protocols: [cli, mcp, http]
    notes: "Sends an operator-selected native API request to the configured ZAP instance."

  - id: wapiti
    kind: arm
    protocols: [cli]
    notes: "Runs the installed Wapiti web scanner against the operator-selected URL."

  - id: commix
    kind: arm
    protocols: [cli]
    notes: "Runs the installed Commix command-injection scanner against the operator-selected URL."

  - id: zdns
    kind: arm
    protocols: [cli]
    notes: "Runs the installed ZDNS resolver against the operator-selected name."

  - id: zgrab2
    kind: arm
    protocols: [cli]
    notes: "Runs the installed ZGrab2 application-handshake scanner against the operator-selected target and module."

  - id: nmap
    kind: arm
    protocols: [cli]
    notes: "Runs the installed Nmap binary against the operator-selected target expression and returns bounded XML output."

  - id: page-fetch
    kind: arm
    protocols: [cli]
    notes: "Feeds the operator-selected HTTP URL to the installed headless browser fetcher."

  - id: http-probe
    kind: arm
    protocols: [cli]
    notes: "Runs a curl HTTP probe with caller-selected headers; returns the status and response preview without following redirects."

  - id: caldera
    kind: arm
    protocols: [http, cli]
    notes: "Sends an operator-selected REST request to the configured Caldera instance."

  - id: osmedeus
    kind: arm
    protocols: [cli, http]
    notes: "Runs the installed Osmedeus CLI for asset reads and scans."

  - id: sniper
    kind: arm
    protocols: [cli]
    notes: "Runs the installed Sniper pentest harness against the operator-selected target. Upstream may launch multiple scanners and contact network services."

  - id: dark-moon
    kind: arm
    protocols: [cli, mcp]
    notes: "Runs the installed Dark Moon launcher for multi-agent campaigns; upstream may launch containers and contact network services."

  - id: routersploit
    kind: arm
    protocols: [cli]
    notes: "Runs an installed RouterSploit module against the operator-selected target."
  - id: rpz-decoder
    kind: arm
    protocols: [cli]
    notes: "Decodes an operator-supplied AXFR dump or uses dig to fetch a zone and read its SOA from the selected master."

  - id: asset-recon
    kind: arm
    protocols: [cli]
    notes: "Builds an asset evidence graph from operator-selected roots, passive sources, registry, CT, PTR, and probes; live actions contact selected services and targets."

  - id: security-detections-mcp
    kind: arm
    protocols: [cli]
    notes: "Reads detection rules from an operator-supplied local index and returns source-byte digests."

  - id: agentseal
    kind: arm
    protocols: [cli]
    notes: "Reads operator-supplied agent-framework fixture data and returns a bounded analysis."


  - id: leonidas
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied cloud-attack corpus as data; this adapter does not execute the corpus."

  - id: specterops-skills
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied methodology catalog and returns tool mappings and human steps as data."

  - id: detection-in-the-cloud
    kind: arm
    protocols: [cli]
    notes: "Reads playbooks from an operator-supplied directory and returns names or file contents."

  - id: pentestkit
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied experiment ledger and summarizes its records."

  - id: collinear
    kind: arm
    protocols: [cli]
    notes: "Reads operator-supplied scenario and submission files and compares the submission with expected findings."

  - id: ad-pathfinder
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied AD-path export and reports path data and missing datasources."

  - id: gpohound
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied GPO export and reports policy applicability evidence."

  - id: claude-ad
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied AD methodology file and separates prerequisites, observations, and inferences."

  - id: numasec
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied finding ledger and derives status from its transition records."

  - id: rubeus
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied AD telemetry file and redacts secret-shaped fields in the result."

  - id: m365pwned
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied M365 consent-case file as local data."
  - id: ivanti
    kind: arm
    protocols: [cli]
    notes: "Queries the operator-configured Ivanti VM API for assets, findings, vulnerabilities, tags, or an export; API credentials are required."

  - id: pashov-x-ray
    kind: methodology-only
    protocols: [none]
    notes: "Pashov skills repo (pashov/skills @ eacfc09) x-ray skill: pre-audit scan that frames a codebase's architecture, entry points, and invariants. Not installed; not invocable; methodology reference only."

  - id: pashov-solidity-auditor
    kind: methodology-only
    protocols: [none]
    notes: "Pashov skills repo (pashov/skills @ eacfc09) solidity-auditor skill: parallel specialized review passes that propose source-anchored Solidity findings as candidates. Not installed; not invocable; methodology reference only."

  - id: pashov-fizz
    kind: methodology-only
    protocols: [none]
    notes: "Pashov skills repo (pashov/skills @ eacfc09) fizz skill: drafts Echidna/Medusa property-suite harnesses for a local Solidity project. Not installed; not invocable; methodology reference only."

  - id: hostbadger
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied HostBadger analyzer JSONL export and reports findings, summaries, and honest coverage status; offline reader only - no collection, remediation, AI, or network path."

  - id: idwolf
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied IDWolf analyzer JSONL export (AD or Entra) and reports findings and honest coverage status; offline reader only - no collector, password-quality, AI, or network path."

  - id: osv
    kind: arm
    protocols: [cli]
    notes: "Reads an operator-supplied OSV-shaped snapshot and runs bounded read-only package or commit advisory queries against the fixed official api.osv.dev host; synthetic fixtures only, statuses distinguish complete, partial, unknown, and error."
