# Survey map for the specaudit-ctf collaboration cut.
# Classifies each surveyed product. Not a ship list of adapters.
# Support tier is research | experimental | maintained | held.
# curated is a deprecated compatibility flag for specialized handlers;
# it is not equivalent to maintained. No rows are held on this cut
# (the HTTP-MCP held set closed 2026-09-04).
# Methodology-only rows are never curated and never maintained.
# research/experimental presence is not a validator support promise.


version: 1
entries:
  - id: loopback
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Native pack-check and validation-client lanes in the specaudit CTF suite. Methodology for this extension, not an adapter.

  - id: foundry
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Open specification for agentic security evaluation, finding lifecycle, and spec-kit workflow.

  - id: codeguard
    kind: methodology-only
    protocols: [mcp, http]
    curated: false
    tier: research
    notes: Model-agnostic secure-by-default rule corpus for AI coding agents, with optional MCP packaging. A check contract, not a scanner.

  - id: vulnhunter
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Attacker-first hunt, falsify, and verify skills. Teach-only methodology.

  - id: edge-device-posture
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Network-edge device posture review (router/CPE/IoT-appliance class) - plane model (management, admin/data, config artifacts), version-disclosure posture, and offline-image vs live-surface reconciliation, with absence-shaped reconciliation verdicts stated explicitly. Instantiated by the lab-edge-01-device-posture live-service challenge against the golden lab target; generalizes to any appliance image with a declared service set.

  - id: defending-code
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Reference recon, find, verify, report, and patch harness with threat-model-gated scan skills.

  - id: mantis
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Portable multi-stage skill toolkit with inspectable artifacts. Teach-only methodology.

  - id: raptor
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Autonomous offensive and defensive review framework that layers static engines under an agent decision loop.

  - id: deepsec
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Agent-powered large-repository scanner. Curated CLI arm wrapping the Node Commander entry (not npx/pnpm). DEEPSEC_SCAN_ROOT must be an existing workspace with config; invocations cwd there. Operator runs init out of band. scan is the unarmed matcher default and writes workspace state. process is gated by DEEPSEC_DISPATCH_SCOPE=localhost (containment is the scan root) and can cost thousands of dollars.

  - id: vvah
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Multi-stage agentic SAST CLI. Curated CLI arm; doctor live-probes configured backends (may spend tokens); estimate spends nothing (VVAH_SCAN_ROOT, cwd pinned). scan defaults to --stop-after s9 and is gated by VVAH_DISPATCH_SCOPE. remediate is the S10 command and requires VVAH_ALLOW_REMEDIATE=1 plus dispatch scope. validate is not exposed. Agentic pipeline may spend model tokens.

  - id: ai-deep-sast
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Hybrid CI SAST. Curated CLI arm; --skip-llm scan is the safe default and requires a local AI_DEEP_SAST_SEMGREP_CONFIG inside the scan root (no registry p/ default). ai_scan runs local Foundation-Sec via llama-completion; frontier deepscan.py is not exposed beyond dry_run --dry-run. Full AI scan is gated by AI_DEEP_SAST_DISPATCH_SCOPE.

  - id: trailofbits
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Marketplace of composable specialist review skills for Claude Code CLI and Codex CLI.

  - id: cloudflare
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Six-phase security-audit skill covering recon, hunt, adversarial validate, report, and independent verify.

  - id: metasploit-mcp
    kind: arm
    protocols: [mcp, http]
    curated: true
    tier: research
    notes: Metasploit Framework MCP over the operator-run local server (GH05TCREW MetasploitMCP, legacy HTTP+SSE) on the hardened shared client - literal-loopback endpoint policy (METASPLOIT_MCP_ENDPOINT must name 127.0.0.1 or [::1]); the client sends no credential (the msfrpcd password is server-side). Exploit/payload/session/listener listings are admitted read capabilities; the execution tools are admitted R1 network-egress dispatch profiles gated by METASPLOIT_DISPATCH_SCOPE with per-host scope matching (host-bearing tools) and scope-presence arming (session/job tools, audited by id).

  - id: burp-mcp
    kind: arm
    protocols: [mcp, http]
    curated: true
    tier: research
    notes: Burp Suite MCP over PortSwigger's official MCP Server BApp (SSE mode, default 127.0.0.1:9876, auto-starts with Burp once the BApp is installed - enabled defaults true and persists in the BApp's extension data, verified from source 2026-09-06), fully usable on the free Community Edition. Admitted read set re-verified from the current tool surface on 2026-09-06 - proxy/WebSocket/Organizer history incl. regex variants, codecs, random text, both config exports (credential-filtered upstream since v1.3.0), and the Pro-gated scanner/Collaborator reads, with no edition gating (tools the connected Burp does not list are refused as unavailable by the arm; active requests, UI mutations, config writes, and the live-editor read stay blocked). Curated SSE arm on the hardened shared transport; endpoint policy is literal-loopback only (BURP_MCP_ENDPOINT must name 127.0.0.1 or [::1]) and the client sends no credential. For the first-class DAST role use the zaproxy arm (free native API).

  - id: agent-wiz
    kind: arm
    protocols: [cli]
    curated: true
    tier: maintained
    notes: Offline agent-framework graph extractor. Curated CLI arm wrapping first-party agent-wiz; the read tier agent-wiz.list_tools is the only maintained capability (X5-PROMOTE, doc 13 evidence gate; owner specaudit-ctf maintainers). extract and visualize are path-contained local reads. analyze (OpenAI egress) is gated by AGENT_WIZ_DISPATCH_SCOPE and credential presence.

  - id: maestro
    kind: methodology-only
    protocols: [http]
    curated: false
    tier: research
    notes: Agentic threat-modeling reference application. Methodology artifact, not an adapter.

  - id: prowler-mcp
    kind: arm
    protocols: [mcp, http]
    curated: true
    tier: research
    notes: First-party CSPM MCP over the official OSS server (prowler-cloud/prowler mcp_server/, fastmcp 3.4.5 streamable HTTP at /mcp) on the hardened shared client. Endpoint policy is the explicit union - operator-fronted https for self-hosted remote deployments, or literal-loopback http for the first-party local default (--transport http, --host 127.0.0.1, --port 8000; upstream ships no TLS). The client sends no credential (hub/docs tools are unauthenticated server-side; tenant tools authenticate to api.prowler.com with a server-held key). Exact-name admission - 43 read lookups pinned from first-party source (10 hub catalog + 2 docs + 31 tenant reads); the 18 mutating tools (scan triggers, mutelist/integration/provider writers, role setting) and the hosted-only prowler_cloud_ namespace are exactly blocked.

  - id: semgrep-mcp
    kind: arm
    protocols: [mcp, cli, http]
    curated: true
    tier: research
    notes: First-party SAST via the semgrep CLI as the primary surface - local rule scans with an inline rule pack (registry/URL configs refused, metrics off), scan containment is the SEMGREP_SCAN_ROOT directory. MCP reads (scan/findings/AST/language/schema) remain available over an operator-configured https endpoint on the hardened transport. No client credential sent for either surface.

  - id: google-mcp-security
    kind: arm
    protocols: [mcp, http]
    curated: true
    tier: research
    notes: Google Threat Intelligence lookups over the official gti-mcp server (Google's google/mcp-security GTI server; FastMCP-based, stdio by default, HTTP-capable by construction) deployed at an operator-configured https endpoint via the hardened shared client. All 32 allowlisted tools are read-only lookups verified against the current official tool inventory (36 tools as of 2026-09-06; the 4 mutating tools - the collection create/update family and the upload-and-share analyse_file - are exactly blocked); no client credential is sent - the upstream holds the sole server-side key (VT_APIKEY, read per-request from the server's environment). No dispatch tier.

  - id: garak
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: LLM vulnerability scanner with a probe, detector, and evaluator pipeline. Curated CLI arm; probe/detector listing and local report reading only, target-bound install, open-ended probe dispatch blocked.

  - id: pyrit
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Multi-turn generative-AI red-team framework. Curated CLI arm wrapping first-party pyrit_scan only. list_scenarios is the read tier; scan is gated by PYRIT_DISPATCH_SCOPE and spends model tokens on the operator-configured endpoints. Requires operator PyRIT config. CoPyRIT GUI is out of scope.

  - id: mitre-atlas
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Adversary knowledge base for AI-enabled systems. Curriculum only.

  - id: cyberseceval
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Published LLM security benchmark suites. Curriculum and eval reference.

  - id: cybench
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Professional CTF task set with subtask grading. Challenge-design reference.

  - id: owasp-agentic
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: OWASP agentic application threats, mitigations, and MCP security guides.

  - id: checkov
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Offline graph-based IaC misconfiguration scanner. Curated CLI arm; fixed-argv terraform scan, offline bundle mode, scan root contained to the packaged synthetic range.

  - id: cloudgoat
    kind: methodology-only
    protocols: [cli]
    curated: false
    tier: research
    notes: Vulnerable-by-design cloud scenarios. Range and curriculum reference, not an adapter.

  - id: stratus-red-team
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Cloud technique library. Curated CLI arm; local technique list reads, warmup/detonate/revert gated by STRATUS_DISPATCH_SCOPE. Dispatch acts cloud-side on the operator's own account — the scope gate binds the technique ID (the armed scope must literally name the technique; anything else is an evaluated failure), and detonation spends real cloud resources.

  - id: attackforge-testsuites
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Import-ready methodology checklists including telecom and cloud suites.

  - id: attackforge-writeups
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: Finding-writeup knowledge bases covering ATT&CK, ATLAS, CWE, and CAPEC.

  - id: attack-stix-data
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Canonical ATT&CK corpus as STIX 2.1 collection bundles. Curated first-party read arm; exact lookups (technique by ATT&CK id or name, software/group by name or alias, bounded relationship reads with a closed type allowlist) over an operator-supplied local STIX bundle. A small verbatim demo sample ships as data under the arm (see its NOTICE; not maintained here). Pure in-process stdlib reader with no subprocess, no endpoint, no network on any tier, and no dispatch tier.

  - id: mitreattack-python
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Official ATT&CK Python library and CLIs. Curated CLI arm; local STIX-to-Excel conversion only, network downloader on no tier.

  - id: mitre-cti
    kind: methodology-only
    protocols: [none]
    curated: false
    tier: research
    notes: STIX 2.0 ATT&CK and CAPEC datasets maintained alongside the 2.1 corpus.

  - id: vuls
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Agent-less host vulnerability scanner. Curated CLI arm; local report/summary reads, host scan gated by VULS_DISPATCH_SCOPE, feed fetch on no tier. Scan targets come from vuls's own config discovery (config.toml at the invoke working directory) — the scope gate arms the scan action, so the armed config is what bounds what gets scanned.

  - id: zaproxy
    kind: arm
    protocols: [cli, mcp, http]
    curated: true
    tier: research
    notes: Intercepting-proxy DAST and this suite's first-class DAST role (the Burp-role substitute; free native API, no Pro features required). Allowlisted view reads incl. spider/ascan results; ascan/spider dispatch gated by ZAP_DISPATCH_SCOPE; passive results via alerts/alerts_summary.

  - id: wapiti
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Black-box web vulnerability scanner. Curated dispatch-only arm (no read-only mode upstream); scans gated by WAPITI_DISPATCH_SCOPE.

  - id: commix
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Command-injection specialist scanner. Curated dispatch-only arm (active prober, no read-only mode upstream); probes gated by COMMIX_DISPATCH_SCOPE.

  - id: zdns
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: High-volume DNS resolution toolkit. Curated dispatch-only arm; live resolution gated by ZDNS_DISPATCH_SCOPE.

  - id: zgrab2
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Application-layer handshake scanner. Curated CLI arm; list_modules is a static allowlist; scan feeds one host on stdin with a closed module set and optional --port. Gated by ZGRAB2_DISPATCH_SCOPE.

  - id: nmap
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Network service discovery. Curated CLI arm over the user's own nmap (NPSL; never bundled); single-host targets, closed flag sets (connect/version/version-light, fixed -T4, top-ports default), XML on stdout capped and redacted; scan dispatch gated by NMAP_DISPATCH_SCOPE. version-light disables discovery and reverse DNS and uses unprivileged TCP version probes.

  - id: page-fetch
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Headless Chrome URL fetcher. Curated dispatch-only arm; http(s) URL with a hostname, then host-scope via PAGE_FETCH_DISPATCH_SCOPE. Upstream reads URLs from stdin only (detectify/page-fetch), so argv never carries the URL — the arm feeds the validated URL as the single stdin line. Private, metadata, and localhost hosts are allowed if in scope; only the initial URL is scope-checked — redirects, name resolution at fetch time, and rendering subresources are not re-checked (treat the armed scope as reachable from anything its hosts redirect or reference to), and browser state may be written in the binary's default location.

  - id: caldera
    kind: arm
    protocols: [http, cli]
    curated: true
    tier: research
    notes: Adversary-emulation platform with ATT&CK-mapped abilities and a REST API. Curated REST arm; allowlisted GET reads, operation scheduling gated by CALDERA_DISPATCH_SCOPE.

  - id: osmedeus
    kind: arm
    protocols: [cli, http]
    curated: true
    tier: research
    notes: Declarative recon orchestration engine. Curated CLI arm; local asset reads, scan dispatch gated by OSMEDEUS_DISPATCH_SCOPE.

  - id: sniper
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Automated pentest harness composing many sub-scanners. Curated dispatch-only CLI arm gated by SNIPER_DISPATCH_SCOPE. Scoping the named target does not bound 90+ sub-tools. Community binary is root-only and phones home when armed. Operators who accept composite egress arm the scope; others leave unarmed.

  - id: dark-moon
    kind: arm
    protocols: [cli, mcp]
    curated: true
    tier: research
    notes: Autonomous multi-agent pentest platform. Curated CLI arm wrapping the shell launcher; MCP tool names stay unpinned and unbound. campaign/run gated by DARK_MOON_DISPATCH_SCOPE. Composite egress inside Docker.

  - id: routersploit
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Exploitation framework for embedded and CPE devices. Curated CLI arm; non-interactive -m run is gated by ROUTERSPLOIT_DISPATCH_SCOPE. Default unarmed. Every run executes the module (not a check-only path).
  - id: rpz-decoder
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Ad-hoc threat-intel extraction from an operator-supplied DNS Response Policy Zone. decode turns an AXFR dump into raw IP/CIDR and domain indicator lists (action-tagged, written to files, sampled in the result); fetch is a dispatch-gated dig AXFR using a 0600 TSIG key file, status a keyless SOA probe. No schedule, no appliance; no zone data or account identifiers ship in the repo.

  - id: asset-recon
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: First-party bounded asset reconnaissance. Offline plan/parse and explicit CT, PTR, registry and passive-provider discovery share one evidence graph. Live provider reads require live=true and exact ASSET_RECON_PROVIDERS grants; probe requires live=true and ASSET_RECON_PROBE_SCOPE, plus the existing tool scope for delegated scanners. Discovered names and graph edges never grant probe authority. Partial results retain evidence but are not complete. No background enumeration or automatic probing.

  - id: security-detections-mcp
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Local rule reads over pinned detection indexes. Curated CLI read arm; no rule generation, index mutation, deployment, or hosted fallback on the read path. Every result is source-attributable. Per-corpus licensing must be reviewed by the operator.

  - id: agentseal
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Offline agent-framework static fixture analysis. Curated CLI read arm; the offline boundary must be verified empirically (no registry or network calls). Every result cites specific configuration evidence. No active modes exposed.

  - id: vulnify
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Bounded local vulnerability reads. Curated CLI read arm over operator-supplied frozen vulnerability snapshots. Unknown and stale data stay explicit; source and snapshot digests appear in evidence. No network or database mutation during a lookup.

  - id: leonidas
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Declarative cloud attack corpus reads. Curated CLI read arm importing the Leonidas technique corpus; executor bodies treated as inert text and no cloud credentials on the read path. Positive, benign, and missing-telemetry variants graded separately.

  - id: specterops-skills
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Curated methodology skill reads from the SpecterOps skills catalog. Every retained instruction maps to a bounded tool or a human step; skill prose is untrusted input and grants no permission. Operator must validate skill-to-tool mappings before use.

  - id: detection-in-the-cloud
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Cloud detection playbook reads. Pages pinned to the corresponding definition revisions; a rule listing is never read as operating effectiveness. Companion methodology, not a second detection engine.

  - id: pentestkit
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Experiment accounting reads. Curated CLI read arm over operator-supplied experiment ledgers. First-pass, tuned, and held-out results stay separate; every failure stays in the denominator; no case silently dropped.

  - id: collinear
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Cybersecurity simulated world scenario reads. Curated CLI read arm; learner and model cannot read expected findings or trace keys. Forged or truncated evidence fails closed. Task/environment/verifier separation maintained at all times.

  - id: ad-pathfinder
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Imported AD path results. Curated CLI read arm; missing datasource reads as not assessed, never clean. No real hashes or credentials distributed. A blocked path is never graded as demonstrated compromise.

  - id: gpohound
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: GPO policy evidence reads. Curated CLI read arm; filtered-out policy is not effective access. Uncovered security/WMI filters and item-level targeting reported as limitations. No shared-graph writes.

  - id: claude-ad
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: AD methodology reads. Curated CLI read arm; prerequisites, observed facts, and inference are separated. No action authorized by a skill. Framework mappings never asserted as compliance.

  - id: numasec
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Finding lifecycle reads. Curated CLI read arm; status changes are attributable and reversible. No model-only status change creates a verified finding. Every change has an actor and reason.

  - id: rubeus
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Deweaponized AD telemetry reads. Curated CLI read arm; no real tickets, hashes, or secrets distributed. Legitimate administration is not automatically classified as compromise.

  - id: m365pwned
    kind: arm
    protocols: [cli]
    curated: true
    tier: research
    notes: Synthetic M365 consent case reads. Curated CLI read arm; no real tenant, mailbox, or file accessed. Permission claims verified against API owner documentation. Live Graph API gated by SAFE-01.
