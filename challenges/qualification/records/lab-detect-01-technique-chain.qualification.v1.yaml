  # own derived verdict; it is not a protected exam and must not be presented
  # as one. The variant's expected outcomes live only in the canaried
  # instructor key, the learner assessment packet strips the verdict-gate
  # declarations, and the shipped worksheet refuses that packet.
  state: proven
  evidence_refs:
    - tests/test_detect_instructor_variant.py::test_assessment_grading_uses_the_instructor_key_only
    - tests/test_detect_instructor_variant.py::test_assessment_key_and_case_bindings_are_enforced
