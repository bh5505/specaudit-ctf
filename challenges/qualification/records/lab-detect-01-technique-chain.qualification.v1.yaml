    - tests/test_containment_instructor_plane.py::test_new_instructor_keys_are_canaried_and_refused
  notes: >-
    Assessment variant: instructor/expected.json (canaried) holds the exact
    five stage states and retest result per case; the learner packet under
    instructor/assessment/ carries scenario prose and complete evidence
    records but strips rule.deployment, collection and attempt declarations,
    so the closed-shape worksheet refuses it and no shipped code path derives
    the verdicts from learner-held material. The key file is enumerated under
    challenges/*/instructor/ and direct reads from a simulated learner root
    are typed-refused. Separation is procedural: the operator must keep the
    instructor directory outside the learner context.
