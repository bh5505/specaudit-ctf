honest_limits:
  - "No review lane is staffed; every lane state is assigned, unstaffed, wholly operator-gated. No person has accepted any review duty."
  - "Transparent self-study retained unchanged: python -m learning.detection_validation still prints its own derived verdict, so the separation claim in this record covers the instructor-controlled assessment variant only, never the self-study flow."
  - "Assessment variant is instructor-controlled: the canaried expected.json holds the stage verdicts and the learner packet strips the verdict-gate declarations (the shipped worksheet refuses the packet), but a learner handed the original self-study packets can still derive the verdicts by reasoning; keeping instructor/ outside the learner context remains an operator duty."
