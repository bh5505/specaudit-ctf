honest_limits:
  - "No review lane is staffed; every lane state is assigned, unstaffed, wholly operator-gated. No person has accepted any review duty."
  - "Instructor-held grading: learning/agent_security_harness.py derives no expected rows and its self-check gives no correctness signal; the old answer-deriving two-argument grade was removed. Correctness grading requires the canaried key document (challenges/lab-agent-01-tool-boundary/instructor/answers.json) bound to the scene digest, which must stay outside the learner context."
  - "The instructor answers.json carries the INSTRUCTOR-CANARY-AGENT-01-ANSWERS marker, so an accidental learner-side export is detectable by byte scan; the KEY.md prose itself still carries no canary, and no prepare-export scan covers this pilot because it is not in the shippable fixture inventory."
  - "Calibration seeds are machine-discriminated author samples (reviewer calibration-seed, adjusted_score null). No human double-scoring has occurred; counting a seed as calibrated review is refused by construction (qualification/loader.py)."
  - "The dry-run procedure is shipped and has never been executed; no learner-path dry-run evidence exists for this pilot."
  - "Trace binding prevents accidental edits and invented evidence in the grading path only; it does not prove runner identity, prevent a stateless replay, or establish pre-execution admission."
  - "Reset determinism is proven for the containment rerun test in this checkout only; it is not environment reset evidence in any delivery environment."
  - "This record itself is not a promotion signal: status stays design-ready until the operator gate is passed."
