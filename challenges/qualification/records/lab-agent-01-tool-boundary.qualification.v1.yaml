schema: specaudit.ctf.qualification-record.v1
id: lab-agent-01-tool-boundary
pilot: lab-agent-01-tool-boundary
status: design-ready
review_lanes:
  - lane: technical
    state: "assigned, unstaffed, wholly operator-gated"
  - lane: safety-operator
    state: "assigned, unstaffed, wholly operator-gated"
  - lane: instructional
    state: "assigned, unstaffed, wholly operator-gated"
learner_context_separation:
  state: proven
  # Only the tests that actually cover THIS pilot. The instructor answers.json
  # is enumerated under challenges/*/instructor/ (canaried), direct reads from
  # a simulated learner root are typed-refused, and the grading tests prove the
  # grader consumes only the instructor-held key.
  evidence_refs:
    - tests/test_agent_instructor_grading.py::test_grade_requires_the_instructor_key
    - tests/test_agent_instructor_grading.py::test_key_shape_canary_and_scene_binding_are_enforced
    - tests/test_containment_instructor_plane.py::test_instructor_plane_enumerated
    - tests/test_containment_instructor_plane.py::test_direct_read_of_instructor_material_is_typed_refused
    - tests/test_containment_instructor_plane.py::test_new_instructor_keys_are_canaried_and_refused
  notes: >-
    Correctness anchors are instructor-held: learning/agent_security_harness.py
    derives no expected rows, its self-check carries no correctness signal, and
    grade() consumes only the closed, canaried, scene-bound key document
    (instructor/answers.json). The key file is enumerated under
    challenges/*/instructor/, a direct read from a simulated learner root is
    typed-refused (root-escape), and the canaried-key test proves both new key
    documents carry their canary markers. Delivery must still mount only the
    brief, a generated trace, and the CLI in a separate learner context.
calibration:
  state: fixtures-shipped-human-scoring-open
  packet: challenges/qualification/calibration/lab-agent-01-tool-boundary/
