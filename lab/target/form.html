<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>lab-target form</title></head>
<body>
  <h1>lab-target form</h1>
  <form method="GET" action="form.html">
    <label>q <input type="text" name="q" value="1"></label>
    <button type="submit">go</button>

  evaluates input. It exists so crawler/scanner-class tools find a form
