# Copy to lab/local.conf (gitignored) and adjust for this machine.
# Every knob is optional; the defaults match lab/build-golden.sh and
# lab/spawn-target.sh.

# Registered name of the freshly installed Debian distro used to build
# the golden rootfs:
# LAB_GOLDEN_NAME=Debian

# Where the golden rootfs tar lives (Windows path):
# LAB_TAR='C:\wsl\lab\ctf-target-base.tar'

# Ephemeral instance name and its Windows-side state dir:
# LAB_TARGET_NAME=ctf-target
# LAB_STATE_DIR='C:\wsl\lab\instances\ctf-target'

# Keep the golden distro registered after export:
# LAB_KEEP_GOLDEN=1
