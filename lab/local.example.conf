# Copy to lab/local.conf (gitignored) and adjust for this machine.
# Every knob is optional; the defaults match lab/setup-kali.sh,
# lab/build-golden.sh, and lab/spawn-target.sh.

# --- Kali dev/test instance (lab/setup-kali.sh) ---
# Registered distro name:
# LAB_KALI_NAME=kali-linux
# Clone URL (default is upstream; override for forks/mirrors):
# LAB_KALI_REPO=https://github.com/bh5505/specaudit-ctf.git
# Repo path and venv path inside the instance:
# LAB_KALI_HOME=/root/ctf
# LAB_KALI_VENV=/opt/ctf
# Apt packages (the Kali-packaged scanner arms by default; add your
# own, e.g. zaproxy):
# LAB_KALI_PKGS=python3-venv python3-pip git nmap wapiti routersploit commix
# Set to 1 to run the full pytest suite at the end of setup:
# LAB_KALI_FULL_TEST=1

# --- Golden target rootfs (lab/build-golden.sh) ---
# Registered name of the freshly installed Debian distro:
# LAB_GOLDEN_NAME=Debian
# Where the golden rootfs tar lives (Windows path):
# LAB_TAR='C:\wsl\lab\ctf-target-base.tar'
# Keep the golden distro registered after export:
# LAB_KEEP_GOLDEN=1

# --- Ephemeral target instance (lab/spawn-target.sh, teardown) ---
# LAB_TARGET_NAME=ctf-target
# LAB_STATE_DIR='C:\wsl\lab\instances\ctf-target'
